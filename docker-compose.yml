services:
  backend:
    build:
      context: ./backend
    container_name: timelapse-backend
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      DATABASE_URL: sqlite:////data/backend/timelapse.db
      STORAGE_PATH: /data/storage
      LOG_PATH: /data/logs
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:-*}
    volumes:
      - backend_db:/data/backend
      - timelapse_storage:/data/storage
      - backend_logs:/data/logs
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/v1/health/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  dashboard:
    build:
      context: ./dashboard
      args:
        VITE_API_BASE_URL: /api/v1
    container_name: timelapse-dashboard
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  backend_db:
  timelapse_storage:
  backend_logs:
